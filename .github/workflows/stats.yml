name: update coobian count
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    paths: [manual.json, scripts/stats.mjs]
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/stats.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          X_BEARER: ${{ secrets.X_BEARER }}
          IG_TOKEN_OUT: ${{ runner.temp }}/ig_token
      # the refreshed instagram token goes back into the repo secret (needs a PAT with secrets write)
      - name: save refreshed instagram token
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          f="$RUNNER_TEMP/ig_token"
          if [ -s "$f" ] && [ -n "$GH_TOKEN" ]; then gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < "$f"; fi
          rm -f "$f"
      - run: |
          git config user.name "coobian-counter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "update coobian count" && git push)
